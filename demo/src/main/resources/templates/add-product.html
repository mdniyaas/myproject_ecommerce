<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Add Product | MyShop', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('products')}"></div>

<section class="content-section">
    <div class="container">
        <div class="row g-4 align-items-stretch">
            <div class="col-lg-5">
                <div class="info-panel">
                    <h2>Add New Product</h2>
                    <p>
                        Create premium product listings with images,
                        pricing, and categories to showcase your
                        ecommerce inventory professionally.
                    </p>
                    <div class="info-feature">
                        <p><i class="fas fa-check-circle"></i> Easy Product Management</p>
                        <p><i class="fas fa-check-circle"></i> Modern Ecommerce Dashboard</p>
                        <p><i class="fas fa-check-circle"></i> Premium UI Experience</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="form-page-card">
                    <h1 class="page-title">Add Product</h1>
                    <p class="page-subtitle">Fill all product details carefully</p>

                    <form th:action="@{/save-product}" th:object="${product}" method="post">
                        <div class="mb-4">
                            <label class="form-label">Product Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter product name">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Price</label>
                            <input type="number" th:field="*{price}" class="form-control" placeholder="Enter product price">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Quantity</label>
                            <input type="number" class="form-control" th:field="*{quantity}" placeholder="Enter Quantity">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Category</label>
                            <input type="text" th:field="*{category}" class="form-control" placeholder="Enter category">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Image URL</label>
                            <input type="text" name="imageUrl" class="form-control" placeholder="https://example.com/image.jpg">
                        </div>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-plus-circle me-2"></i> Save Product
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
