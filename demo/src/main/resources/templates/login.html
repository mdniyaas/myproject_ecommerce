<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Login - MyShop', 'auth')}"></head>

<body class="auth-page">

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<div class="container login-container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="login-card">
                <div class="login-logo">
                    <i class="fas fa-shopping-bag"></i>
                </div>

                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Login to continue shopping with MyShop</p>

                <div th:if="${param.error}" class="alert alert-danger text-center">
                    Invalid Username or Password
                </div>

                <div th:if="${param.logout}" class="alert alert-success text-center">
                    Logged out successfully
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="input-group-custom">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
                    </div>

                    <div class="input-group-custom">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" class="form-control" id="password" placeholder="Enter Password" required>
                        <span class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember Me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt me-2"></i> Login
                    </button>
                </form>

                <div class="social-login">
                    <p class="social-title">Or login with</p>
                    <div class="social-buttons">
                        <button class="social-btn" type="button"><i class="fab fa-google"></i></button>
                        <button class="social-btn" type="button"><i class="fab fa-facebook-f"></i></button>
                        <button class="social-btn" type="button"><i class="fab fa-github"></i></button>
                    </div>
                </div>

                <p class="register-text">
                    Don't have an account?
                    <a href="/register">Create Account</a>
                </p>

                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i>
                    Your login is protected with secure encryption
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    let password = document.getElementById("password");
    let eyeIcon = document.getElementById("eyeIcon");
    if (password.type === "password") {
        password.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
    }
}
</script>
</body>
</html>
