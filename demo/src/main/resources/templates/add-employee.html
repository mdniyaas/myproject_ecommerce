<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Add Employee', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('employees')}"></div>

<section class="content-section">
    <div class="container">
        <div class="employee-card">
            <h1 class="page-title">Add New Employee</h1>
            <p class="page-subtitle">Manage your company employees professionally</p>

            <form th:action="@{/save-employee}" th:object="${employee}" method="post">
                <div class="mb-4">
                    <label class="form-label">Employee Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Enter employee name">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Employee Role</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-briefcase"></i></span>
                        <input type="text" th:field="*{role}" class="form-control" placeholder="Enter employee role">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Salary</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-indian-rupee-sign"></i></span>
                        <input type="number" th:field="*{salary}" class="form-control" placeholder="Enter salary">
                    </div>
                </div>
                <div class="mb-3">
                    <label>Attendance</label>
                    <select th:field="*{attendance}" class="form-select">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">
                    <i class="fas fa-save me-2"></i> Save Employee
                </button>
            </form>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
