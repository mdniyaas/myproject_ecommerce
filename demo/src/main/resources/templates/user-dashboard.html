<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>User Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-page">

<div class="sidebar">
    <h2>User Panel</h2>
    <a href="/user-dashboard" class="active"><i class="fas fa-home"></i> Dashboard</a>
    <a href="/products"><i class="fas fa-box"></i> Products</a>
    <a href="/cart"><i class="fas fa-shopping-cart"></i> Cart</a>
    <a href="/checkout"><i class="fas fa-credit-card"></i> Checkout</a>
    <a href="/wishlist"><i class="fas fa-heart"></i> Wishlist</a>
    <a th:href="@{/orders}"><i class="fas fa-truck"></i> Orders</a>
    <a href="#"><i class="fas fa-map-marker-alt"></i> Address</a>
    <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main-content">
    <div class="topbar">
        <h3>User Dashboard</h3>
        <div class="profile-box">
            <span>Welcome User</span>
            <img th:src="${user.profileImage}" class="profile-image" alt="Profile">
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="dashboard-card text-center">
                <i class="fas fa-shopping-bag card-icon"></i>
                <h4 class="mt-3">Orders</h4>
                <h2 th:text="${orderCount}"></h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="dashboard-card text-center">
                <i class="fas fa-heart card-icon"></i>
                <h4 class="mt-3">Wishlist</h4>
                <h2>5</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="dashboard-card text-center">
                <i class="fas fa-wallet card-icon"></i>
                <h4 class="mt-3">Total Spending</h4>
                <h2>₹<span th:text="${totalSpent}"></span></h2>
            </div>
        </div>
    </div>

    <div class="profile-card">
        <div class="text-center mb-4">
            <img src="https://i.pravatar.cc/150" class="profile-image" alt="Profile">
            <h3 class="mt-3">User Profile</h3>
        </div>

        <form th:action="@{/update-profile}" method="post" th:object="${user}">
            <input type="hidden" th:field="*{id}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Username</label>
                    <input type="text" class="form-control" th:field="*{username}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Email</label>
                    <input type="email" class="form-control" th:field="*{email}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Mobile Number</label>
                    <div class="input-group">
                        <input type="text" class="form-control" th:field="*{phone}">
                        <button class="btn btn-success" type="button">Verify OTP</button>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Street Address</label>
                    <input type="text" class="form-control" th:field="*{address}">
                </div>
            </div>
            <div class="col-md-12 mb-3">
                <label>Profile Image URL</label>
                <input type="text" class="form-control" th:field="*{profileImage}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>City</label>
                    <input type="text" class="form-control" th:field="*{city}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>+Pincode</label>
                    <input type="text" class="form-control" th:field="*{pincode}">
                </div>
            </div>
            <button class="btn-save">Save Profile</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
