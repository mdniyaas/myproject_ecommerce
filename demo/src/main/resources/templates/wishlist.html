<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('My Wishlist', 'wishlist')}"></head>

<body class="wishlist-page">

<div class="container">
    <div class="stats">
        <div class="stat-card">
            <h3>Total Wishlist Items</h3>
            <span th:text="${wishlistItems != null ? #lists.size(wishlistItems) : 0}"></span>
        </div>
        <div class="stat-card">
            <h3>Favorite Products</h3>
            <p>❤️</p>
        </div>
    </div>

    <div class="card">
        <div class="header">
            <h1>❤️ My Wishlist</h1>
            <span class="badge">Saved Products</span>
        </div>

        <div class="table-wrapper">
            <table th:if="${not #lists.isEmpty(wishlistItems)}">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${wishlistItems != null}" th:each="item : ${wishlistItems}">
                        <td th:text="${item.productName}"></td>
                        <td class="price">₹ <span th:text="${item.price}"></span></td>
                        <td>
                            <a th:href="@{/cart/add/{id}(id=${item.productId})}" class="btn buy-btn">Buy Now</a>
                            <a th:href="@{/wishlist/remove/{id}(id=${item.id})}" class="btn remove-btn">Remove</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="empty" th:if="${#lists.isEmpty(wishlistItems)}">
                🛒 Your wishlist is currently empty.
                <br><br>
                Start adding products you love!
            </div>
        </div>
    </div>
</div>

</body>
</html>
