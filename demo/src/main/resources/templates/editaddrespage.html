<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit Address', null)}"></head>

<body class="orders-page">

<div class="container mt-5">
    <div class="form-page-card">
        <h3 class="page-title">Edit Address</h3>
        <form action="/order/update" method="post">
            <input type="hidden" name="id" th:value="${order.id}">
            <textarea class="form-control mb-3" name="address" rows="4" th:text="${order.address}"></textarea>
            <button class="btn-save" type="submit">Update Address</button>
        </form>
    </div>
</div>

</body>
</html>
