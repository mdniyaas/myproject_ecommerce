<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Shopping Cart', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('cart')}"></div>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="cart-title">Your Shopping Cart</h1>
        <p class="cart-subtitle">Review your products and proceed to checkout</p>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div th:if="${#lists.isEmpty(cartItems)}">
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <h2>Your Cart Is Empty</h2>
                    <p class="text-muted mt-3">Add products to continue shopping</p>
                    <a href="/products" class="btn btn-primary mt-4 px-4 py-3 rounded-pill">Continue Shopping</a>
                </div>
            </div>

            <div th:each="item : ${cartItems}" class="cart-card">
                <div class="row align-items-center">
                    <div class="col-md-2 text-center">
                        <div class="cart-icon"><i class="fas fa-box"></i></div>
                    </div>
                    <div class="col-md-4">
                        <h3 class="product-name" th:text="${item.productName}"></h3>
                        <p class="text-muted">Added To Cart</p>
                    </div>
                    <div class="col-md-2">
                        <span class="qty-number" th:text="${item.quantity}"></span>
                    </div>
                    <div class="col-md-2">
                        <div class="product-price">₹<span th:text="${item.price}"></span></div>
                    </div>
                    <div class="col-md-2 text-end">
                        <a th:href="@{/cart/delete/{id}(id=${item.id})}" class="btn-remove">
                            <i class="fas fa-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="summary-box">
                <h3>Order Summary</h3>
                <div class="summary-line">
                    <span>Products</span>
                    <span th:text="${#lists.size(cartItems)}"></span>
                </div>
                <div class="summary-line">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <hr>
                <div class="summary-line">
                    <strong>Total</strong>
                    <strong class="total-price">₹<span th:text="${total}"></span></strong>
                </div>
                <a href="/checkout" class="btn-checkout text-decoration-none d-block text-center">
                    <i class="fas fa-lock me-2"></i> Proceed To Checkout
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
