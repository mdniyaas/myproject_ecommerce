<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Products', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('products')}"></div>

<div class="page-header">
    <h1>All Products</h1>
</div>

<div class="container mb-5">
    <form class="row g-3 mb-4 search-sort-form" action="/products" method="get">
        <div class="col-md-6">
            <input type="text" name="keyword" class="form-control" placeholder="Search products...">
        </div>
        <div class="col-md-3">
            <select name="sort" class="form-select">
                <option value="">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="name">Name</option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" type="submit">Search</button>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-lg-3 col-md-4 col-sm-6" th:each="product : ${products}">
            <div class="card h-100 product-card">
                <img th:src="${product.imageUrl}" class="card-img-top product-image" alt="Product">
                <div class="card-body">
                    <h5 th:text="${product.name}"></h5>
                    <small class="text-muted" th:text="${product.category}"></small>
                    <h4 class="price mt-2">₹<span th:text="${product.price}"></span></h4>
                    <p>Stock: <span th:text="${product.quantity}"></span></p>
                    <a th:href="@{/cart/add/{id}(id=${product.id})}" class="btn btn-primary btn-sm w-100 mb-2">
                        Add to Cart
                    </a>
                    <a th:href="@{/wishlist/add/{id}(id=${product.id})}" class="btn btn-outline-danger btn-sm w-100">
                        Wishlist
                    </a>
                    <div class="mt-2" sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/edit-product/{id}(id=${product.id})}" class="btn btn-warning btn-sm w-100 mb-1">Edit</a>
                        <a th:href="@{/delete-product/{id}(id=${product.id})}" class="btn btn-danger btn-sm w-100">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
