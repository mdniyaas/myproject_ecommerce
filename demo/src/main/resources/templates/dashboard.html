<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="admin-page">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">
    <div class="topbar">
        <h3>Dashboard Overview</h3>
        <div class="admin-profile">
            <span>Welcome Admin</span>
            <img src="https://i.pravatar.cc/100" alt="admin">
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="dashboard-card bg-blue">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5>Total Products</h5>
                        <h1 th:text="${productCount}"></h1>
                    </div>
                    <div class="card-icon"><i class="fas fa-box"></i></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card bg-green">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5>Total Employees</h5>
                        <h1 th:text="${employeeCount}"></h1>
                    </div>
                    <div class="card-icon"><i class="fas fa-users"></i></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card bg-orange">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5>Total Orders</h5>
                        <h1 th:text="${orderCount}"></h1>
                    </div>
                    <div class="card-icon"><i class="fas fa-shopping-cart"></i></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card bg-red">
                <div class="d-flex justify-content-between">
                    <div>
                        <h5>Total Revenue</h5>
                        <h1>₹<span th:text="${totalRevenue}"></span></h1>
                    </div>
                    <div class="card-icon"><i class="fas fa-wallet"></i></div>
                </div>
            </div>
        </div>
    </div>

    <div class="chart-card">
        <h4 class="mb-4">Sales Analytics</h4>
        <canvas id="salesChart"></canvas>
    </div>

    <div class="chart-card mt-4">
        <h4 class="mb-4 text-danger">
            <i class="fas fa-exclamation-triangle"></i> Low Stock Products
        </h4>
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${lowStock}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.category}"></td>
                    <td>₹<span th:text="${product.price}"></span></td>
                    <td><span class="badge bg-danger" th:text="${product.quantity}"></span></td>
                    <td><span class="badge bg-warning text-dark">Low Stock</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:inline="javascript">
    const ctx = document.getElementById('salesChart');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Jan','Feb','Mar','Apr','May','Jun'],
            datasets: [{
                label: 'Sales',
                data: /*[[${monthlySales}]]*/ [],
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                borderWidth: 3,
                tension: 0.4,
                fill: true
            }]
        },
        options: { responsive: true }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
