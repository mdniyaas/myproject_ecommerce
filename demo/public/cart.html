<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<nav class="navbar premium-navbar navbar-dark fixed-top"><div class="container"><a class="navbar-brand premium-logo text-white" href="/"><i class="fas fa-store"></i> MyShop</a></div></nav>
<div class="container py-5 text-center" style="padding-top:120px">
    <h1 class="cart-title">Your Shopping Cart</h1>
    <p class="cart-subtitle">Review your products and proceed to checkout</p>
    <div class="empty-cart mt-4">
        <i class="fas fa-shopping-cart"></i>
        <h2>Your Cart Is Empty</h2>
        <p class="text-muted mt-3">Add products to continue shopping</p>
        <a href="/products.html" class="btn btn-primary mt-4 px-4 py-3 rounded-pill">Continue Shopping</a>
    </div>
</div>
</body>
</html>
