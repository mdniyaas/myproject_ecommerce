<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Checkout - MyShop', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('checkout')}"></div>

<section class="checkout-section">
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="checkout-title">Secure Checkout</h1>
            <p class="checkout-subtitle">Complete your order safely and quickly</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="checkout-card">
                    <h4 class="mb-4 fw-bold">Shipping Details</h4>
                    <form>
                        <div class="mb-3">
                            <label>Name</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Phone</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Address</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>City</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Pincode</label>
                            <input type="text" class="form-control">
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="order-summary">
                    <h4 class="summary-title">Order Summary</h4>
                    <div th:each="item : ${cartItems}" class="summary-item">
                        <span th:text="${item.productName}"></span>
                        <span>₹<span th:text="${item.price}"></span></span>
                    </div>
                    <hr>
                    <div class="summary-total d-flex justify-content-between">
                        <span>Total :</span>
                        <span>₹<span th:text="${total}"></span></span>
                    </div>

                    <div class="checkout-features">
                        <div class="feature-item">
                            <i class="fas fa-shield-alt"></i>
                            <span>100% Secure Payment</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-truck"></i>
                            <span>Fast Delivery</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-undo"></i>
                            <span>Easy Returns</span>
                        </div>
                    </div>

                    <form th:action="@{/place-order}" method="post">
                        <button type="submit" class="btn-place-order">Place Order</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
