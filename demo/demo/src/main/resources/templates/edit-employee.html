<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Edit Employee', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('employees')}"></div>

<div class="container edit-wrapper">
    <div class="edit-card">
        <div class="edit-header mb-4">
            <h1><i class="fas fa-user-pen me-2"></i> Edit Employee</h1>
            <p class="text-muted">Update employee details professionally</p>
        </div>

        <form th:action="@{/update-employee/{id}(id=${employee.id})}" th:object="${employee}" method="post">
            <div class="mb-4">
                <label class="form-label">Employee Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Enter employee name">
            </div>
            <div class="mb-4">
                <label class="form-label">Employee Role</label>
                <input type="text" th:field="*{role}" class="form-control" placeholder="Enter employee role">
            </div>
            <div class="mb-4">
                <label class="form-label">Salary</label>
                <input type="number" th:field="*{salary}" class="form-control" placeholder="Enter salary">
            </div>
            <div class="mb-4">
                <label class="form-label">Attendance</label>
                <select th:field="*{attendance}" class="form-select">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>
            <button type="submit" class="btn-save">
                <i class="fas fa-save me-2"></i> Update Employee
            </button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
