<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Edit Product', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('products')}"></div>

<div class="container py-5">
    <div class="form-page-card">
        <h1 class="page-title">Edit Product</h1>

        <form th:action="@{/update-product}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" th:field="*{name}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" th:field="*{price}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" th:field="*{quantity}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" th:field="*{category}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input type="text" th:field="*{imageUrl}" class="form-control">
            </div>

            <button type="submit" class="btn-save">Update Product</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
