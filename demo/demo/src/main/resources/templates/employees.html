<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Employee Management', null)}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar('employees')}"></div>

<section class="page-banner">
    <div>
        <h1>Employee Management</h1>
        <p>Manage employees, attendance, salaries and staff details</p>
    </div>
</section>

<div class="container mt-5">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="stats-box">
                <i class="fas fa-users"></i>
                <h2 th:text="${employees.size()}"></h2>
                <p>Total Employees</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-box">
                <i class="fas fa-user-check"></i>
                <h2>25</h2>
                <p>Present Today</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stats-box">
                <i class="fas fa-user-times"></i>
                <h2>3</h2>
                <p>Absent Today</p>
            </div>
        </div>
    </div>
</div>

<div class="container mb-5 mt-4">
    <div class="employee-card">
        <div class="top-actions">
            <h2 class="fw-bold">Employee List</h2>
            <a href="/add-employee" class="btn btn-add">
                <i class="fas fa-plus me-2"></i> Add Employee
            </a>
        </div>

        <div class="table-responsive">
            <table class="table employee-table align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Role</th>
                        <th>Salary</th>
                        <th>Attendance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="employee : ${employees}">
                        <td th:text="${employee.id}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="50" height="50" class="rounded-circle" alt="Employee">
                                <div>
                                    <h6 class="mb-0" th:text="${employee.name}"></h6>
                                    <small class="text-muted">Staff Member</small>
                                </div>
                            </div>
                        </td>
                        <td><span class="role-badge" th:text="${employee.role}"></span></td>
                        <td>₹<span th:text="${employee.salary}"></span></td>
                        <td>
                            <span th:class="${employee.attendance == 'Present'} ? 'present' : 'absent'" th:text="${employee.attendance}"></span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/edit-employee/{id}(id=${employee.id})}" class="btn btn-primary btn-sm">
                                    <i class="fas fa-pen"></i>
                                </a>
                                <a th:href="@{/delete-employee/{id}(id=${employee.id})}" class="btn btn-delete">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
